[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opendrs"
version = "0.1.0"
description = "Codeplug editor for DRS/DR-8500 series .F136 project files"
authors = [{ name = "windasd" }]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/windasd/OpenDRS"
Releases = "https://github.com/windasd/OpenDRS/releases"
Issues = "https://github.com/windasd/OpenDRS/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
build = ["pyinstaller>=6.22"]  # python packaging/build.py

[project.scripts]
opendrs = "opendrs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["opendrs"]
omit = ["*/opendrs/__main__.py"]
