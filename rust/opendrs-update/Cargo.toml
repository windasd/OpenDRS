[package]
name = "opendrs-update"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = "0.4.45"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
# No gzip: like urllib, ask for the plain file so the size matches the bytes received.
# platform-verifier: trust the operating system's certificate store, as Python's ssl module does.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# deflate-flate2 only, on flate2's pure-Rust backend (miniz_oxide): reading needs no zopfli
# or zlib-rs.
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2"] }
