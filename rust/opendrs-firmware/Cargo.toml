[package]
name = "opendrs-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
encoding_rs = "0.8.35"
# no default features: the firmware tools never list serial ports (no libudev needed on Linux)
opendrs-core = { version = "0.1.0", path = "../opendrs-core", default-features = false }
regex = "1.13.1"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
# float_roundtrip: parse the oracle's floats exactly (the default parser can be off by one ULP)
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
