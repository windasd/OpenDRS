[package]
name = "opendrs-contacts"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
opendrs-core = { version = "0.1.0", path = "../opendrs-core" }
regex = "1.13.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
# No gzip: like urllib, ask for the plain file so Content-Length matches the bytes received.
# platform-verifier: trust the operating system's certificate store, as Python's ssl module does.
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
# The same TLS stack as ureq's, used directly only by `tls_ready` (the self-test).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
sha2 = "0.11.0"
