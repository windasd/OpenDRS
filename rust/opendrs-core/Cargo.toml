[package]
name = "opendrs-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["libudev"]
# Linux: USB details for serial ports (vendor ID, product name) through libudev. Turn off with
# --no-default-features to build without libudev (ports are still listed, without USB details).
libudev = ["serialport/libudev"]

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
encoding_rs = "0.8.35"
regex = "1.13.1"
serde_json = "1.0.151"
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[dev-dependencies]
sha2 = "0.11.0"
