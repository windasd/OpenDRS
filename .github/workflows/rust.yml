# Rust 重寫分支：Windows／Linux／macOS 各跑格式、clippy（警告視為錯誤）、測試，再各自打包
# （cargo xtask dist：release 建置、打包後自我測試、壓縮）；另一個工作用 Python 版重新產生
# 比對答案，確認提交的 parity*.json 是最新的。
name: rust

on:
  push:
    branches: [rust-rewrite]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安裝 libudev 與視窗程式庫（Linux 列出序列埠、egui 視窗用）
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
          libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: 安裝 Rust stable
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: 格式
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 測試（含與 Python 版的逐欄比對、實機擷取重播）
        run: cargo test --workspace --locked
      - name: 三個平台的執行檔都有第三方授權全文
        if: runner.os == 'Linux'
        run: >-
          cargo xtask licenses --target x86_64-pc-windows-msvc --target aarch64-apple-darwin
          --target x86_64-unknown-linux-gnu

  dist:
    name: 打包（${{ matrix.os }}）
    needs: rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Linux 版在較舊的 Ubuntu 上建置，連結的 glibc 版本低，較多發行版能執行
        os: [windows-latest, ubuntu-22.04, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 自我測試會載入中文字型、建立繪圖介面（沒有 GPU 的 Linux 用 lavapipe 軟體繪圖）
      - name: 安裝 libudev、視窗程式庫、中文字型與軟體繪圖（Linux）
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
          libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          fonts-noto-cjk mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri
      - name: 安裝 Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: 建置、自我測試、壓縮
        run: cargo xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenDRS-rust-${{ runner.os }}
          path: rust/dist/OpenDRS-*
          if-no-files-found: error
          retention-days: 30

  oracle:
    name: 比對答案是最新的（Python 3.13.15）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 版已不在這個分支：取出最後一個含 Python 版的 commit（含比對時修正的問題）當標準答案。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 8aa7c0b2667a474c497792df75997958c9bf63f3
          path: opendrs-oracle
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 答案裡記著產生它的 Python 與 Unicode 版本；升級時改這裡並重新產生所有答案。
          python-version: "3.13.15"
      - name: 安裝 pyserial 與 PySide6（GUI 答案用真正的 Qt 元件離屏產生）
        run: python -m pip install "pyserial>=3.5" "PySide6==6.11.2"
      - name: 重新產生所有比對答案
        shell: bash
        env:
          PYTHONPATH: opendrs-oracle/src
          PYTHONUTF8: "1"
        run: |
          python rust/tools/make_parity.py > rust/opendrs-core/tests/parity.json
          python rust/tools/make_parity_model.py > rust/opendrs-core/tests/parity_model.json
          python rust/tools/make_parity_firmware.py > rust/opendrs-firmware/tests/parity.json
          python rust/tools/make_parity_contacts.py > rust/opendrs-contacts/tests/parity.json
          python rust/tools/make_parity_contacts.py --tables > rust/opendrs-core/src/pystr_tables.rs
          python rust/tools/make_codec_tables.py > rust/opendrs-core/src/codec_tables.rs
          python rust/tools/make_parity_gui.py > rust/opendrs-gui/tests/parity_table.json
          python rust/tools/make_parity_pages.py > rust/opendrs-gui/tests/parity_pages.json
      - name: 與提交的版本相同
        shell: bash
        run: |
          git diff --stat --exit-code -- rust ||
            { echo "::error::Python 版的行為變了：請重新產生上面列出的答案檔並確認 Rust 測試通過"; exit 1; }
